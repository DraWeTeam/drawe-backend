plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.3.0'
}

checkstyle {
    toolVersion = '10.12.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    maxWarnings = 10
}

spotless {
    java {
        googleJavaFormat()
    }
}

group = 'com.drawe'
version = '0.0.1-SNAPSHOT'
description = 'drawe-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // ── Spring Boot core ────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'   // FastAPI / Pinecone WebClient
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Komoran 형태소 분석 (PoC)
    implementation 'com.github.shin285:KOMORAN:3.3.9'

    // S2' Phase 6 Layer 1 — JTokkit (토큰 카운팅)
    implementation 'com.knuddels:jtokkit:1.1.0'

    // Jackson JSR-310 (Instant 직렬화) — 이미 spring-boot-starter-web 에 포함되어 있을 가능성 ↑
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ── Observability — Actuator + Micrometer ───────────────
    // 클라우드 배포용. health probe (liveness/readiness) + metrics endpoint (/actuator/prometheus)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // ── Resilience — Spring Retry (Multi-AZ failover, transient DB error 대응) ──
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // ── Resilience4j — 외부 API(LLM/CLIP/Pinecone/Bria) 타임아웃·서킷브레이커·재시도 ──
    // 동기 .block()/RestClient 체인의 장애가 톰캣 스레드풀을 고갈시켜 서비스 전체로
    // 전파되는 것을 차단. 설계: docs/decisions/S1-resilience4j-design.md
    // starter-aop: @CircuitBreaker/@Retry 어노테이션 AOP 동작에 필요.
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // ── AWS S3 — AI 이미지 영구 저장 (presigned URL 서빙) ──────
    // BOM 으로 버전 일원화. s3 모듈에 S3Client·S3Presigner 둘 다 포함.
    // 기본 프로파일은 DbImageStorage(MySQL) 유지, s3 프로파일에서만 S3 빈 활성화.
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    // 동기 S3Client 는 HTTP 클라이언트 구현체가 별도로 필요하다(s3 아티팩트가 자동으로 안 끌고 옴).
    // 없으면 런타임에 Apache HC5(TlsSocketStrategy) 를 찾다 NoClassDefFoundError 로 S3Client 생성 실패.
    // PutObject + presigned URL 용도엔 JDK HttpURLConnection 기반 url-connection-client 가 가볍고 충분.
    implementation 'software.amazon.awssdk:url-connection-client'

    // ── Flyway — DB schema migration ─────────────────────────
    // prod 에서는 JPA_DDL_AUTO=validate 로 Hibernate 가 스키마 만들지 않음.
    // Flyway 가 src/main/resources/db/migration/V*.sql 을 순차 적용.
    // dev 는 default 로 update 지만 Flyway 도 같이 동작 (호환).
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // ── JWT ─────────────────────────────────────────────────
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ── DB / Misc ───────────────────────────────────────────
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
